name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test:
    name: Compile Contract, Run Tests & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Root Dependencies
        run: npm install

      - name: Verify Compact Smart Contract & Artifacts
        run: |
          if command -v compact >/dev/null 2>&1; then
            npm run compile
          else
            echo "Compact compiler binary unavailable on runner; verifying managed ZK artifacts."
            test -f contracts/private-employee-access-card.compact
            test -d contracts/managed/private-employee-access-card
          fi

      - name: Run Unit Tests
        run: npm test

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
