name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Run Vitest unit tests (pure TS logic, no blockchain deps)
  # ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Vitest test runner
        run: npm install --no-save vitest@latest typescript@5.6.3

      - name: Run unit tests
        run: npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────
  # Job 2: Verify Compact contract source + compiled artifacts
  # ─────────────────────────────────────────────────────────
  verify-contract:
    name: Verify Compact Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Compact contract source
        run: |
          echo "--- Checking Compact contract source ---"
          test -f contracts/private-employee-access-card.compact \
            && echo "PASS: Contract source found" \
            || (echo "FAIL: Contract source missing" && exit 1)

      - name: Verify compiled ZK circuit artifacts
        run: |
          echo "--- Checking compiled ZK artifacts ---"
          test -d contracts/managed/private-employee-access-card \
            && echo "PASS: Managed artifacts directory found" \
            || (echo "FAIL: Managed artifacts missing" && exit 1)
          test -f contracts/managed/private-employee-access-card/contract/index.js \
            && echo "PASS: Contract JS bundle present" \
            || (echo "FAIL: Contract JS bundle missing" && exit 1)
          test -f contracts/managed/private-employee-access-card/compiler/contract-info.json \
            && echo "PASS: contract-info.json present" \
            || (echo "FAIL: contract-info.json missing" && exit 1)

      - name: Display contract summary
        run: |
          echo "=== Compact Contract Source (first 25 lines) ==="
          head -25 contracts/private-employee-access-card.compact

  # ─────────────────────────────────────────────────────────
  # Job 3: Build & Publish Production Deployment Environment
  # ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend & Publish Deployment
    runs-on: ubuntu-latest

    environment:
      name: Production
      url: https://leafy-chaja-e5b9d4.netlify.app/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build React frontend
        working-directory: frontend
        run: npx vite build

      - name: Verify build output
        run: |
          test -d frontend/dist \
            && echo "PASS: Frontend dist directory present" \
            || (echo "FAIL: Frontend dist missing" && exit 1)
          test -f frontend/dist/index.html \
            && echo "PASS: index.html present" \
            || (echo "FAIL: index.html missing" && exit 1)
          echo "=== Build Artifacts ==="
          ls -lh frontend/dist/
